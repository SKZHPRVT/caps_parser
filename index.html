<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Calculator</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--tg-theme-bg-color, #1c1c1e);
    color: var(--tg-theme-text-color, #ffffff);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }
  body { padding: 14px 12px 40px; }
  h1 { margin: 0 0 14px; font-size: 22px; font-weight: 800; letter-spacing: -0.4px; }
  .label { display: block; font-size: 12px; opacity: 0.7; margin-bottom: 6px; margin-top: 12px; font-weight: 600; }
  .label:first-of-type { margin-top: 0; }
  input {
    width: 100%; padding: 13px 14px; font-size: 16px; font-weight: 600;
    border-radius: 12px; border: 1px solid var(--tg-theme-hint-color, #3a3a3c);
    background: var(--tg-theme-secondary-bg-color, #2c2c2e);
    color: var(--tg-theme-text-color, #fff);
    outline: none; transition: border-color 0.15s;
    -webkit-appearance: none; appearance: none;
  }
  input:focus { border-color: var(--tg-theme-button-color, #2ea6ff); }
  button.main-btn {
    width: 100%; padding: 14px; font-size: 16px; font-weight: 700;
    border: none; border-radius: 12px; margin-top: 14px;
    background: var(--tg-theme-button-color, #2ea6ff);
    color: var(--tg-theme-button-text-color, #ffffff);
    cursor: pointer; transition: opacity 0.15s;
  }
  button.main-btn:active { opacity: 0.75; }

  .base-info {
    margin: 14px 0 0; padding: 11px 13px;
    background: rgba(255, 204, 0, 0.12);
    border-left: 3px solid #ffcc00;
    border-radius: 8px; font-size: 13px; line-height: 1.6;
    font-weight: 600;
  }
  .base-info b { color: #ffcc00; }
  .base-info .muted { opacity: 0.6; font-size: 12px; font-weight: 400; }

  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0 6px; }
  .chip {
    padding: 7px 12px; border-radius: 20px;
    font-size: 14px; font-weight: 800;
    background: var(--tg-theme-secondary-bg-color, #2c2c2e);
    border: 1px solid var(--tg-theme-hint-color, #3a3a3c);
    cursor: pointer; user-select: none; transition: all 0.15s;
    text-transform: lowercase;
  }
  .chip.active {
    background: var(--tg-theme-button-color, #2ea6ff);
    border-color: var(--tg-theme-button-color, #2ea6ff);
    color: #fff;
  }
  .search-wrap { margin-top: 10px; }
  .search-wrap input { padding: 10px 12px; font-size: 14px; }

  .coll-list { margin-top: 10px; }
  .coll-item {
    border-bottom: 1px solid var(--tg-theme-hint-color, #2a2a2c);
    overflow: hidden;
  }
  .coll-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 4px; cursor: pointer; user-select: none;
    transition: background 0.15s;
  }
  .coll-header:active { background: rgba(255,255,255,0.04); }
  .coll-left { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
  .coll-name {
    font-size: 17px;
    font-weight: 800;
    letter-spacing: -0.2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .coll-meta {
    font-size: 14px;
    font-weight: 800;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    text-transform: lowercase;
  }
  .coll-meta .meta-emission { opacity: 0.55; font-weight: 700; }
  .coll-meta .meta-count    { opacity: 0.55; font-weight: 700; }
  .coll-meta .meta-mult     { opacity: 0.55; font-weight: 700; }

  .rarity-common    { color: #8e8e93; }
  .rarity-special   { color: #5ac8fa; }
  .rarity-event     { color: #ff9500; }
  .rarity-community { color: #af52de; }
  .rarity-premium   { color: #ffcc00; }

  .coll-right { display: flex; align-items: center; gap: 8px; margin-left: 10px; }
  .coll-price-block {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
  }
  .coll-common-price {
    color: #4cd964;
    font-weight: 800;
    font-size: 15px;
    white-space: nowrap;
  }
  .coll-diff {
    font-size: 11px;
    font-weight: 800;
    white-space: nowrap;
  }
  .coll-diff.up   { color: #4cd964; }
  .coll-diff.down { color: #ff453a; }
  .coll-diff.eq   { color: #8e8e93; }

  .chev {
    width: 8px; height: 8px;
    border-right: 2px solid currentColor;
    border-bottom: 2px solid currentColor;
    transform: rotate(-45deg);
    opacity: 0.5; transition: transform 0.2s; flex-shrink: 0;
  }
  .coll-item.open .chev { transform: rotate(45deg); }

  .rarities {
    max-height: 0; overflow: hidden;
    transition: max-height 0.35s ease;
    background: rgba(255,255,255,0.02);
    border-radius: 8px;
  }
  .coll-item.open .rarities { max-height: 1200px; }
  .rarities-inner { padding: 8px 6px 14px; }

  .rarity-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 8px;
    align-items: center;
    padding: 8px 4px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .rarity-row:last-child { border-bottom: none; }

  .rarity-name-block {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .rname { font-size: 13px; font-weight: 800; }
  .rmult { opacity: 0.4; font-size: 11px; margin-left: 6px; font-weight: 600; }
  .rprice { color: #4cd964; font-weight: 800; font-size: 13px; }

  .rmarket-input {
    width: 90px;
    padding: 7px 9px;
    font-size: 13px;
    font-weight: 700;
    border-radius: 8px;
    border: 1px solid var(--tg-theme-hint-color, #3a3a3c);
    background: var(--tg-theme-secondary-bg-color, #2c2c2e);
    color: var(--tg-theme-text-color, #fff);
    text-align: right;
  }
  .rmarket-input::placeholder { opacity: 0.3; font-weight: 400; }
  .rmarket-input:focus { border-color: var(--tg-theme-button-color, #2ea6ff); }

  .rdiff {
    font-size: 12px;
    font-weight: 800;
    white-space: nowrap;
    text-align: right;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 1px;
    min-width: 78px;
  }
  .rdiff .rdiff-abs { font-size: 12px; }
  .rdiff .rdiff-pct { font-size: 11px; opacity: 0.85; }
  .rdiff.up   { color: #4cd964; }
  .rdiff.down { color: #ff453a; }
  .rdiff.eq   { color: #8e8e93; opacity: 0.7; }
  .rdiff.empty { opacity: 0.3; }

  .empty { text-align: center; padding: 40px 20px; opacity: 0.5; font-size: 14px; }
  .summary {
    margin-top: 16px; padding: 12px;
    background: var(--tg-theme-secondary-bg-color, #2c2c2e);
    border-radius: 10px; font-size: 12px; opacity: 0.75; line-height: 1.7;
    font-weight: 600;
  }
  .summary b { opacity: 1; font-weight: 800; }
</style>
</head>
<body>

<h1>Calculator</h1>

<label class="label" for="basePrice">Цена common «x kaidzen 1»</label>
<input id="basePrice" type="number" step="0.0001" inputmode="decimal" placeholder="5" value="5">

<label class="label" for="minMarket">Мин. цена ЛЮБОЙ фишки на маркете (опционально)</label>
<input id="minMarket" type="number" step="0.0001" inputmode="decimal" placeholder="например 0.093">

<button class="main-btn" onclick="calculate()">Пересчитать</button>

<div id="baseInfo" class="base-info" style="display:none"></div>

<div class="filters" id="filters" style="display:none">
  <div class="chip active" data-r="all">Все</div>
  <div class="chip" data-r="common">common</div>
  <div class="chip" data-r="special">special</div>
  <div class="chip" data-r="event">event</div>
  <div class="chip" data-r="community">community</div>
  <div class="chip" data-r="premium">premium</div>
</div>

<div class="search-wrap" id="searchWrap" style="display:none">
  <input id="search" type="text" placeholder="Поиск коллекции...">
</div>

<div id="result"><div class="empty">Введи цену и нажми «Пересчитать»</div></div>

<div id="summary" class="summary" style="display:none"></div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.expand(); tg.ready(); }

const BASE_EMISSION = 1200;

const RARITIES = [
  { key: "common",   label: "common",   mult: 1   },
  { key: "common+",  label: "common+",  mult: 2   },
  { key: "rare",     label: "rare",     mult: 6   },
  { key: "rare+",    label: "rare+",    mult: 12  },
  { key: "epic",     label: "epic",     mult: 36  },
  { key: "epic+",    label: "epic+",    mult: 108 },
  { key: "legend",   label: "legend",   mult: 216 },
  { key: "legend+",  label: "legend+",  mult: 324 },
  { key: "diamond",  label: "diamond",  mult: 348 },
];

const COLLECTIONS = [
  { name: "rocket mice",       rarity: "common",    count: 9,  emission: 600000 },
  { name: "smokin",            rarity: "common",    count: 9,  emission: 900000 },
  { name: "puppet street",     rarity: "common",    count: 6,  emission: 600000 },
  { name: "kapuzya",           rarity: "common",    count: 6,  emission: 1200000 },
  { name: "meme furcap",       rarity: "common",    count: 6,  emission: 800000 },
  { name: "Beavis & gum-head", rarity: "common",    count: 6,  emission: 1200000 },
  { name: "one cap man",       rarity: "common",    count: 9,  emission: 600000 },
  { name: "the fifth cap",     rarity: "common",    count: 9,  emission: 900000 },
  { name: "helga's secret",    rarity: "common",    count: 9,  emission: 600000 },
  { name: "adventures caps",   rarity: "common",    count: 9,  emission: 400000 },
  { name: "ashes of glory",    rarity: "common",    count: 9,  emission: 600000 },
  { name: "pixel nostalgia",   rarity: "common",    count: 9,  emission: 900000 },
  { name: "cheeton",           rarity: "common",    count: 12, emission: 900000 },
  { name: "wrestlemania",      rarity: "common",    count: 9,  emission: 800000 },
  { name: "pepe",              rarity: "common",    count: 9,  emission: 400000 },
  { name: "garden of myth",    rarity: "common",    count: 9,  emission: 700000 },
  { name: "x caps",            rarity: "common",    count: 9,  emission: 900000 },
  { name: "mortal caps",       rarity: "common",    count: 12, emission: 690000 },
  { name: "zords",             rarity: "common",    count: 9,  emission: 600000 },
  { name: "catapolis",         rarity: "common",    count: 9,  emission: 600000 },
  { name: "90s girls",         rarity: "common",    count: 9,  emission: 400000 },
  { name: "bitonicle",         rarity: "common",    count: 9,  emission: 520000 },
  { name: "mickey",            rarity: "common",    count: 9,  emission: 300000 },
  { name: "tonder surprise",   rarity: "common",    count: 9,  emission: 400000 },
  { name: "gumanoid",          rarity: "common",    count: 9,  emission: 250000 },
  { name: "tonchu caps",       rarity: "common",    count: 9,  emission: 690000 },
  { name: "simptons",          rarity: "common",    count: 15, emission: 690000 },
  { name: "pocatontas",        rarity: "common",    count: 9,  emission: 690000 },
  { name: "need for ton",      rarity: "common",    count: 9,  emission: 400000 },
  { name: "tonosaurs",         rarity: "common",    count: 9,  emission: 400000 },
  { name: "street fighton",    rarity: "common",    count: 12, emission: 520000 },
  { name: "tonsper",           rarity: "common",    count: 12, emission: 520000 },
  { name: "ton and jerry",     rarity: "common",    count: 12, emission: 520000 },
  { name: "ninja tonturtles",  rarity: "common",    count: 12, emission: 345000 },
  { name: "ton kombat",        rarity: "common",    count: 15, emission: 345000 },
  { name: "power tongers",     rarity: "common",    count: 9,  emission: 345000 },
  { name: "goton city",        rarity: "common",    count: 9,  emission: 175000 },
  { name: "back in the 90\"s", rarity: "common",    count: 9,  emission: 175000 },
  { name: "sailor ton",        rarity: "common",    count: 12, emission: 175000 },
  { name: "batonman",          rarity: "common",    count: 9,  emission: 175000 },
  { name: "glitchy pixel",     rarity: "special",   count: 6,  emission: 100000 },
  { name: "neon dream",        rarity: "special",   count: 6,  emission: 100000 },
  { name: "capstonverse",      rarity: "event",     count: 9,  emission: 150000 },
  { name: "madnessland",       rarity: "event",     count: 6,  emission: 75000 },
  { name: "winter tales",      rarity: "event",     count: 9,  emission: 102000 },
  { name: "mad caps",          rarity: "event",     count: 9,  emission: 50000 },
  { name: "tonsters",          rarity: "event",     count: 10, emission: 600000 },
  { name: "ton is",            rarity: "event",     count: 6,  emission: 100000 },
  { name: "capston",           rarity: "event",     count: 10, emission: 108000 },
  { name: "grinchton",         rarity: "event",     count: 6,  emission: 92000 },
  { name: "du rove",           rarity: "event",     count: 6,  emission: 101100 },
  { name: "halloween",         rarity: "event",     count: 12, emission: 66700 },
  { name: "zodiac",            rarity: "community", count: 12, emission: 30000 },
  { name: "nuts farm",         rarity: "community", count: 6,  emission: 25000 },
  { name: "duckygram",         rarity: "community", count: 6,  emission: 42000 },
  { name: "daopeople",         rarity: "community", count: 3,  emission: 25000 },
  { name: "happy farmer",      rarity: "community", count: 3,  emission: 25000 },
  { name: "gatto",             rarity: "community", count: 9,  emission: 100000 },
  { name: "naruton",           rarity: "community", count: 9,  emission: 50000 },
  { name: "noir",              rarity: "community", count: 6,  emission: 50000 },
  { name: "ton station",       rarity: "community", count: 3,  emission: 25000 },
  { name: "ton festival",      rarity: "community", count: 6,  emission: 20000 },
  { name: "ton 2k",            rarity: "community", count: 3,  emission: 25000 },
  { name: "ton church",        rarity: "community", count: 3,  emission: 7000 },
  { name: "notcoin",           rarity: "community", count: 6,  emission: 60000 },
  { name: "not punks",         rarity: "community", count: 3,  emission: 25000 },
  { name: "zifretta",          rarity: "community", count: 3,  emission: 21300 },
  { name: "fanton",            rarity: "community", count: 6,  emission: 20000 },
  { name: "daolama",           rarity: "community", count: 3,  emission: 25000 },
  { name: "the daily ton",     rarity: "community", count: 3,  emission: 5000 },
  { name: "memhustle",         rarity: "community", count: 6,  emission: 25000 },
  { name: "yupland",           rarity: "community", count: 6,  emission: 5000 },
  { name: "full metal jetton", rarity: "community", count: 3,  emission: 5000 },
  { name: "blockbusters",      rarity: "community", count: 12, emission: 50000 },
  { name: "medieval caps",     rarity: "community", count: 6,  emission: 15000 },
  { name: "tamatonchi",        rarity: "premium",   count: 6,  emission: 50000 },
  { name: "turtle power",      rarity: "premium",   count: 6,  emission: 50000 },
  { name: "x kaidzen 2",       rarity: "premium",   count: 3,  emission: 2000 },
  { name: "national cars",     rarity: "premium",   count: 9,  emission: 50000 },
  { name: "x kaidzen 1",       rarity: "premium",   count: 3,  emission: 1200 },
];

let currentData = [];
let activeFilter = "all";
let searchQuery = "";
const openState = {};
const marketPrices = {};

function commonPrice(emission, base) {
  return base * BASE_EMISSION / emission;
}

function calcProfit(calculated, market) {
  if (!market || market <= 0 || !calculated || calculated <= 0) {
    return { abs: null, pct: null };
  }
  const abs = calculated - market;
  const pct = (abs / market) * 100;
  return { abs, pct };
}

function profitClass(pct) {
  if (pct === null) return '';
  if (pct > 0.5) return 'up';
  if (pct < -0.5) return 'down';
  return 'eq';
}

function formatProfitAbs(abs) {
  if (abs === null) return '';
  const sign = abs > 0 ? '+' : '';
  if (Math.abs(abs) >= 100) return `${sign}${abs.toFixed(1)}`;
  if (Math.abs(abs) >= 1)   return `${sign}${abs.toFixed(2)}`;
  if (Math.abs(abs) >= 0.01) return `${sign}${abs.toFixed(3)}`;
  return `${sign}${abs.toFixed(5)}`;
}

function formatProfitPct(pct) {
  if (pct === null) return '';
  const sign = pct > 0 ? '+' : '';
  if (Math.abs(pct) >= 1000) return `${sign}${pct.toFixed(0)}%`;
  if (Math.abs(pct) >= 100)  return `${sign}${pct.toFixed(1)}%`;
  return `${sign}${pct.toFixed(2)}%`;
}

function calculate() {
  let base = parseFloat(document.getElementById('basePrice').value);
  const minMarket = parseFloat(document.getElementById('minMarket').value);

  if (!base || base <= 0 || isNaN(base)) {
    if (tg?.showAlert) tg.showAlert('Введи корректную цену x kaidzen 1');
    else alert('Введи корректную цену x kaidzen 1');
    return;
  }

  let adjusted = false;
  let origBase = base;
  if (minMarket && minMarket > 0) {
    const maxEmission = Math.max(...COLLECTIONS.map(c => c.emission));
    const calcMin = commonPrice(maxEmission, base);
    if (minMarket > calcMin) {
      base = base * (minMarket / calcMin);
      adjusted = true;
    }
  }

  currentData = COLLECTIONS.map(c => {
    const cp = commonPrice(c.emission, base);
    return {
      ...c,
      commonPrice: cp,
      prices: RARITIES.map(r => ({ ...r, price: cp * r.mult }))
    };
  });

  const info = document.getElementById('baseInfo');
  info.style.display = 'block';
  let html = '';
  if (adjusted) {
    html += `База скорректирована по маркету:<br>`;
    html += `Было: <b>${formatPrice(origBase)}</b> → Стало: <b>${formatPrice(base)}</b>`;
    html += `<div class="muted">Самая дешёвая common при базе ${formatPrice(origBase)}: ${formatPrice(commonPrice(Math.max(...COLLECTIONS.map(c=>c.emission)), origBase))}, на маркете: ${formatPrice(minMarket)}</div>`;
  } else {
    html += `Базовая цена common «x kaidzen 1»: <b>${formatPrice(base)}</b>`;
  }
  info.innerHTML = html;

  document.getElementById('filters').style.display = 'flex';
  document.getElementById('searchWrap').style.display = 'block';
  renderList();
  renderSummary(base);
}

function renderList() {
  let list = currentData;
  if (activeFilter !== 'all') list = list.filter(c => c.rarity === activeFilter);
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(c => c.name.toLowerCase().includes(q));
  }

  if (!list.length) {
    document.getElementById('result').innerHTML = '<div class="empty">Ничего не найдено</div>';
    return;
  }

  let html = '<div class="coll-list">';
  for (const c of list) {
    const isOpen = openState[c.name] ? 'open' : '';
    const diff = (c.emission / BASE_EMISSION).toFixed(2);

    const commonMarket = marketPrices[c.name]?.['common'];
    const cp = calcProfit(c.commonPrice, commonMarket);
    let diffHtml = '';
    if (cp.pct !== null) {
      diffHtml = `<div class="coll-diff ${profitClass(cp.pct)}">${formatProfitAbs(cp.abs)} (${formatProfitPct(cp.pct)})</div>`;
    }

    html += `<div class="coll-item ${isOpen}" data-name="${escapeAttr(c.name)}">
      <div class="coll-header" onclick="toggleItem('${escapeAttr(c.name)}')">
        <div class="coll-left">
          <div class="coll-name">${escapeHtml(c.name)}</div>
          <div class="coll-meta">
            <span class="rarity-${c.rarity}">${c.rarity}</span>
            <span class="meta-count">×${c.count}</span>
            <span class="meta-emission">(эмиссия ${c.emission.toLocaleString('ru-RU')})</span>
            <span class="meta-mult">${diff}×</span>
          </div>
        </div>
        <div class="coll-right">
          <div class="coll-price-block">
            <span class="coll-common-price">${formatPrice(c.commonPrice)}</span>
            ${diffHtml}
          </div>
          <span class="chev"></span>
        </div>
      </div>
      <div class="rarities">
        <div class="rarities-inner">
          ${c.prices.map(p => {
            const savedMarket = marketPrices[c.name]?.[p.key] ?? '';
            const pr = calcProfit(p.price, parseFloat(savedMarket));
            const cls = profitClass(pr.pct);
            const absLabel = pr.abs === null ? '' : formatProfitAbs(pr.abs);
            const pctLabel = pr.pct === null ? '' : formatProfitPct(pr.pct);
            const emissionInRow = Math.round(c.emission * p.mult);
            return `
              <div class="rarity-row">
                <div class="rarity-name-block">
                  <span class="rname">${p.label}<span class="rmult">×${p.mult}</span></span>
                  <span class="rprice">${formatPrice(p.price)} <span class="rmult">(эмиссия ${emissionInRow.toLocaleString('ru-RU')})</span></span>
                </div>
                <input
                  class="rmarket-input"
                  type="number"
                  step="0.0001"
                  inputmode="decimal"
                  placeholder="маркет"
                  value="${savedMarket}"
                  data-coll="${escapeAttr(c.name)}"
                  data-rar="${p.key}"
                  oninput="onMarketInput(this)"
                >
                <span class="rdiff ${cls} ${pr.pct === null ? 'empty' : ''}">
                  ${pr.pct === null ? '—' : `<span class="rdiff-abs">${absLabel}</span><span class="rdiff-pct">(${pctLabel})</span>`}
                </span>
              </div>`;
          }).join('')}
        </div>
      </div>
    </div>`;
  }
  html += '</div>';
  document.getElementById('result').innerHTML = html;
}

function onMarketInput(input) {
  const coll = input.dataset.coll;
  const rar = input.dataset.rar;
  const val = parseFloat(input.value);

  if (!marketPrices[coll]) marketPrices[coll] = {};
  if (!val || val <= 0 || isNaN(val)) {
    delete marketPrices[coll][rar];
  } else {
    marketPrices[coll][rar] = val;
  }

  const row = input.closest('.rarity-row');
  const diffEl = row.querySelector('.rdiff');
  const collData = currentData.find(c => c.name === coll);
  const rData = collData?.prices.find(p => p.key === rar);

  if (rData) {
    const pr = calcProfit(rData.price, val);
    const cls = profitClass(pr.pct);
    diffEl.className = `rdiff ${cls} ${pr.pct === null ? 'empty' : ''}`;
    if (pr.pct === null) {
      diffEl.textContent = '—';
    } else {
      diffEl.innerHTML = `<span class="rdiff-abs">${formatProfitAbs(pr.abs)}</span><span class="rdiff-pct">(${formatProfitPct(pr.pct)})</span>`;
    }
  }

  if (rar === 'common') {
    const headerBlock = document.querySelector(`.coll-item[data-name="${cssEscape(coll)}"] .coll-price-block`);
    const existing = headerBlock?.querySelector('.coll-diff');
    const pr = calcProfit(collData.commonPrice, val);
    if (pr.pct === null) {
      if (existing) existing.remove();
    } else {
      const text = `${formatProfitAbs(pr.abs)} (${formatProfitPct(pr.pct)})`;
      if (existing) {
        existing.className = `coll-diff ${profitClass(pr.pct)}`;
        existing.textContent = text;
      } else if (headerBlock) {
        const el = document.createElement('div');
        el.className = `coll-diff ${profitClass(pr.pct)}`;
        el.textContent = text;
        headerBlock.appendChild(el);
      }
    }
  }
}

function toggleItem(name) {
  openState[name] = !openState[name];
  const el = document.querySelector(`.coll-item[data-name="${cssEscape(name)}"]`);
  if (el) el.classList.toggle('open', openState[name]);
}

function renderSummary(base) {
  const el = document.getElementById('summary');
  el.style.display = 'block';
  const totalEmission = COLLECTIONS.reduce((s, c) => s + c.emission, 0);
  const totalCount = COLLECTIONS.reduce((s, c) => s + c.count, 0);
  const cheapest = [...currentData].sort((a, b) => a.commonPrice - b.commonPrice)[0];
  const expensivest = [...currentData].sort((a, b) => b.commonPrice - a.commonPrice)[0];

  el.innerHTML =
    `Коллекций: <b>${COLLECTIONS.length}</b> · фишек в коллекциях: <b>${totalCount}</b><br>` +
    `Суммарная эмиссия: <b>${totalEmission.toLocaleString('ru-RU')}</b><br>` +
    `Мин. common: <b>${escapeHtml(cheapest.name)}</b> — ${formatPrice(cheapest.commonPrice)}<br>` +
    `Макс. common: <b>${escapeHtml(expensivest.name)}</b> — ${formatPrice(expensivest.commonPrice)}`;
}

function formatPrice(p) {
  if (p >= 1000)   return p.toFixed(1);
  if (p >= 1)      return p.toFixed(2);
  if (p >= 0.01)   return p.toFixed(2);
  if (p >= 0.0001) return p.toFixed(4);
  return p.toFixed(6);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/"/g, '&quot;'); }
function cssEscape(s) { return String(s).replace(/(["\\])/g, '\\$1'); }

document.getElementById('filters').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  activeFilter = chip.dataset.r;
  renderList();
});

document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  renderList();
});

window.addEventListener('DOMContentLoaded', () => {
  calculate();
});
</script>
